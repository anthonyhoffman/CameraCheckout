{% extends "base.html" %}
{% block title %}Reserve a Camera{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-4">Reserve a Camera</h1>

    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Your Name</label>
        <input type="text" name="name" class="form-control form-control-lg" placeholder="First Last" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">NetID</label>
        <input type="text" name="netid" class="form-control form-control-lg" placeholder="e.g. ahoffma8" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Camera</label>
        <select name="camera_id" class="form-select form-select-lg" required>
          <option value="">— Select a camera —</option>
          {% for item in cameras %}
            {% set cam = item.camera %}
            {% set res = item.reservation %}
            <option value="{{ cam['id'] }}">
              Camera {{ cam['number'] }}{% if res %} (booked today){% endif %}
            </option>
          {% endfor %}
        </select>
        <div class="form-text">Cameras noted as "booked today" may still be available on future dates.</div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Pickup Date</label>
        <input type="text" id="pickup_date" name="pickup_date" class="form-control form-control-lg"
               placeholder="Select a date" required>
        <div class="form-text">Camera is due back 2 days after pickup.</div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Confirm Reservation</button>
      </div>
    </form>

    <div class="mt-3 text-center">
      <a href="{{ url_for('index') }}">← Back to availability</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  flatpickr("#pickup_date", {
    minDate: "today",
    dateFormat: "Y-m-d",
    disableMobile: false,
    allowInput: false
  });
</script>
{% endblock %}
