<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Camera Checkout{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">📷 Camera Checkout</a>
      <div>
        <a href="{{ url_for('my_reservation') }}" class="btn btn-outline-light btn-sm me-2">My Reservation</a>
        {% if session.get('admin') %}
          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-warning btn-sm me-2">Admin</a>
          <a href="{{ url_for('admin_logout') }}" class="btn btn-outline-light btn-sm">Log out</a>
        {% else %}
          <a href="{{ url_for('admin_login') }}" class="btn btn-outline-light btn-sm">Admin</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container my-4">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ 'danger' if category == 'error' else ('warning' if category == 'info' else 'success') }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
